<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneStyle Mariana - Catálogo</title>
    <link rel="stylesheet" href="/css/tienda.css">
</head>
<body>
    <div class="header">
        <h1>👗 OneStyle Mariana</h1>
        <p>Catálogo conectado en tiempo real a MySQL</p>
    </div>

    <!-- Si se pasó algún mensaje de éxito o error -->
    {% if mensaje %}
        <div class="alert">{{ mensaje }}</div>
    {% endif %}

    <div class="grid">
        {% for p in productos %}
        <div class="card">
            <div>
                <span class="badge">{{ p.nombre_categoria }}</span>
                <div class="title">{{ p.nombre_producto }}</div>
                <div class="price">${{ "{:,.2f}".format(p.precio_detallista) }}</div>
            </div>
            
            <form action="/comprar" method="POST">
                <input type="hidden" name="id_variante" value="1">
                <label for="cant_{{ p.id_producto }}" class="form-label-cant">Cantidad:</label>
                <input type="number" id="cant_{{ p.id_producto }}" name="cantidad" value="1" min="1" max="20" class="form-input-cant">
                <button type="submit" class="btn-comprar">Comprar prenda</button>
            </form>
        </div>
        {% else %}
        <p>No hay prendas registradas en la base de datos.</p>
        {% endfor %}
    </div>
</body>
</html>
